name: Governance

on:
  workflow_dispatch:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  governance:
    name: Verify (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Run representative verification
        run: npm run ci:verify -- --require-node-major ${{ matrix.node }}
        env:
          HARNESS_CI_EVIDENCE: ${{ runner.temp }}/harness-ci-evidence.json

      - name: Upload platform evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-${{ matrix.os }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/harness-ci-evidence.json
          if-no-files-found: error
